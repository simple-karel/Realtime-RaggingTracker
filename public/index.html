<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragging Tracker System</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for analytics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <!-- Socket.io for real-time updates -->
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
</head>
<body>
    <!-- Floating particle orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <header>
            <h1>Ragging Tracker</h1>
            <p>Anonymously report and analyze ragging incidents in Sri Lankan universities</p>
        </header>

        <!-- Report Submission Section -->
        <section class="card form-card">
            <div class="section-badge">Report</div>
            <div class="section-header">
                <h2>Submit Incident Report</h2>
            </div>
            
            <form id="reportForm">
                <div class="form-group">
                    <label for="university"><i class="fas fa-university"></i> University</label>
                    <select id="university" required>
                        <option value="" disabled selected>Choose University</option>
                        <option value="Colombo">Colombo</option>
                        <option value="Jaffna">Jaffna</option>
                        <option value="Peradeniya">Peradeniya</option>
                        <option value="Jayewardenepura">Jayewardenepura</option>
                        <option value="Ruhuna">Ruhuna</option>
                        <option value="Sabaragamuwa">Sabaragamuwa</option>
                        <option value="Kelaniya">Kelaniya</option>
                        <option value="Eastern">Eastern</option>
                        <option value="South Eastern">South Eastern</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="raggingType"><i class="fas fa-exclamation-circle"></i> Ragging Type</label>
                    <select id="raggingType" required>
                        <option value="" disabled selected>Choose Ragging Type</option>
                        <option value="Verbal Harassment">Verbal Harassment</option>
                        <option value="Physical Harassment">Physical Harassment</option>
                        <option value="Sexual Harassment">Sexual Harassment</option>
                        <option value="Psychological Abuse">Psychological Abuse</option>
                        <option value="Cyber Bullying">Cyber Bullying</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="perpetrator"><i class="fas fa-user-secret"></i> Perpetrator (Optional)</label>
                    <input type="text" id="perpetrator" placeholder="Enter name (if known)">
                </div>

                <div class="form-group">
                    <label for="details"><i class="fas fa-comment-alt"></i> Incident Details</label>
                    <textarea id="details" rows="5" placeholder="Describe the incident" required></textarea>
                </div>

                <button type="submit" id="submitReportBtn">
                    <i class="fas fa-paper-plane"></i> Submit Report
                </button>
            </form>
            <div class="loader" id="reportLoader"></div>
        </section>

        <div class="glow-line"></div>

        <!-- Search Section -->
        <section class="card search-card">
            <div class="section-badge">Search</div>
            <div class="section-header">
                <h2>Search Perpetrators</h2>
            </div>
            
            <div class="form-group">
                <label for="searchQuery"><i class="fas fa-search"></i> Perpetrator Name</label>
                <input type="text" id="searchQuery" placeholder="Search by name">
            </div>

            <div class="form-group">
                <label for="filterOptions"><i class="fas fa-filter"></i> Filter By</label>
                <select id="filterOptions">
                    <option value="all">All Reports</option>
                    <option value="recent">Recent Reports</option>
                    <option value="university">By University</option>
                    <option value="raggingType">By Ragging Type</option>
                </select>
            </div>

            <button type="button" id="searchBtn">
                <i class="fas fa-search"></i> Search
            </button>

            <div id="searchResults">
                <div class="result-item">
                    <div class="result-title">No Results</div>
                    <div class="result-description">Search for a perpetrator to view reports.</div>
                </div>
            </div>
        </section>

        <div class="glow-line"></div>

        <!-- Analytics Section -->
        <section class="card analytics-card">
            <div class="section-badge">Insights</div>
            <div class="section-header">
                <h2>Incident Analytics</h2>
            </div>
            
            <div class="chart-container">
                <div class="chart-wrapper">
                    <div class="chart-title">By University</div>
                    <canvas id="universityChart"></canvas>
                </div>
                
                <div class="chart-wrapper">
                    <div class="chart-title">By Ragging Type</div>
                    <canvas id="raggingTypeChart"></canvas>
                </div>
                
                <div class="chart-wrapper">
                    <div class="chart-title">Trends Over Time</div>
                    <canvas id="trendChart"></canvas>
                </div>
                
                <div class="chart-wrapper">
                    <div class="chart-title">Distribution</div>
                    <canvas id="distributionChart"></canvas>
                </div>
            </div>
            
            <button type="button" id="exportBtn">
                <i class="fas fa-file-export"></i> Export Data
            </button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
    </html>
